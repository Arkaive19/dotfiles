###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Basic bindings

bind = $mainMod, Q, exec, $terminal
bind = $mainMod SHIFT, X, exec, ws=$(hyprctl activewindow -j | jq -r '.workspace'); hyprctl clients -j | jq -r --argjson ws "$ws" '.[] | select(.workspace==$ws) | .pid' | xargs -r kill -9
bind = $mainMod, X, exec, kill -9 $(hyprctl activewindow -j | jq -r '.pid') 
bind = $mainMod, C, killactive
bind = $mainMod, F, exec, hyprctl dispatch fullscreen
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, $menu
bind = $mainMod, SPACE, exec, $submenu
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit
bind = $mainMod ALT, left, exec, ~/.config/hypr/scripts/rotate-all-monitors.sh left 
bind = $mainMod ALT, right, exec, ~/.config/hypr/scripts/rotate-all-monitors.sh right
# Screenshots & picker
bind = $mainMod SHIFT, C,   exec, hyprpicker | wl-copy
bind =         , PRINT, exec, grimblast --freeze save area - | swappy -f - -o ~/Pictures/Screenshot/$(date +%F-%H-%M-%S).png
bind =    SHIFT,PRINT,   exec, kooha
bind = $mainMod, T,      exec, /home/arkaive19/.config/hypr/scripts/toggle_bar.sh 
bind = $mainMod, TAB,    exec, ~/.config/Wallpapers/Scripts/themeChanger.sh
bind = $mainMod SHIFT, TAB, exec, ~/.config/Wallpapers/Scripts/themeChangerLive.sh

bind = $mainMod, H,      exec, eww open csheet --toggle
bind = $mainMod, L,      exec, hyprlock

bind = $mainMod, ESCAPE, exec, wlogout -C /home/arkaive19/.config/wlogout/nova.css

# Workspace focus
bind = $mainMod, left,   movefocus, l
bind = $mainMod, right,  movefocus, r
bind = $mainMod, up,     movefocus, u
bind = $mainMod, down,   movefocus, d

bind = $mainMod, W, exec, rofi -show filebrowser -theme ~/.config/rofi/layout.rasi
bind = $mainMod, U,      exec, eww open loadout --toggle  
bind = $mainMod, K, exec, bash -c "[ $(pidof wvkbd-deskintl) ] && pkill wvkbd-deskintl || wvkbd-deskintl"

bind = $mainMod, B,      exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/clipboard.rasi | cliphist decode | wl-copy
bind = $mainMod SHIFT, B,exec,  cliphist wipe && notify-send "Clipboard Cleared!" "Clipboard history cleared."



# Switch workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace 1-10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys
# Volume
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86Launch6, exec, swayosd-client --input-volume mute-toggle


# Capslock
bindr = CAPS, Caps_Lock, exec, swayosd-client --caps-lock


# Brightness
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise 
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
