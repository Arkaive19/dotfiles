###################
### LOOK AND FEEL ###
###################


source = ~/.config/hypr/hyprland_conf/border.conf
general {
    gaps_in = 2
    gaps_out =  11,15,11,4
    border_size = 1
    col.inactive_border = rgba(59595900)
    resize_on_border = true
    allow_tearing = false
#    layout = dwindle
     layout = dwindle
}

decoration {
    rounding = 20
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0 

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes
    
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = myBezier1, 0.05, 0.9, 0.1, 1


    animation = global,        1,     10,    default
    animation = border,        1,     10,    default
    animation = borderangle,   1,     8,     default
    animation = windows,       1,     7,     myBezier,     slide
    animation = windowsIn,     1,     7,     myBezier,     slide
    animation = windowsOut,    1,     7,     myBezier,     slide
    animation = fade,          1,     7,     default
    animation = workspaces,    1,     6,     myBezier,     slide
    animation = zoomFactor,    1,     7,     myBezier

#    animation = layers,        1,     7,  myBezier, slide
    animation = layersIn,      1,     7,    myBezier1, slide
    animation = layersOut,     1,     7,    myBezier,  slide



}





dwindle {
    preserve_split = true
}

master {
  new_status = master
}

misc {
  force_default_wallpaper = 0
    disable_hyprland_logo = true
    mouse_move_enables_dpms=true
    key_press_enables_dpms=true
}

decoration {
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
    }
}

layerrule = animation slide left, match:namespace eww-bar
layerrule = animation slide right, match:namespace eww-bar-filler
